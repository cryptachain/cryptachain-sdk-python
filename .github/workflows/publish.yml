name: Publish to PyPI

# Runs only when a GitHub release is published (tag vX.Y.Z).
# Trusted publishing (OIDC): no tokens or secrets are used.
# If the version in pyproject.toml already exists on PyPI, every build/publish step is skipped
# (PyPI files are immutable; a re-upload would fail with "file exists").
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cryptachain/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Skip if this version is already on PyPI
        id: guard
        run: |
          python3 - <<'PY'
          import os, tomllib, urllib.error, urllib.request
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          url = f"https://pypi.org/pypi/{project['name']}/{project['version']}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  status = r.status
          except urllib.error.HTTPError as e:
              status = e.code
          if status not in (200, 404):
              raise SystemExit(f"unexpected PyPI status {status} for {url}")
          exists = "true" if status == 200 else "false"
          print(f"{url} -> {status}; already_published={exists}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"already_published={exists}\n")
          PY

      - name: Set up Python
        if: steps.guard.outputs.already_published != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        if: steps.guard.outputs.already_published != 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check release tag equals package version
        if: steps.guard.outputs.already_published != 'true'
        run: |
          python - <<'PY'
          import glob, os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match pyproject version v{version}")
          files = sorted(os.path.basename(p) for p in glob.glob("dist/*"))
          want = {f"cryptachain-{version}.tar.gz", f"cryptachain-{version}-py3-none-any.whl"}
          if set(files) != want:
              sys.exit(f"dist/ is {files}, expected {sorted(want)}")
          print(f"OK: {tag} == v{version}; dist = {files}")
          PY

      - name: Publish to PyPI
        if: steps.guard.outputs.already_published != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
